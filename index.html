<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motu Patlu Topup - Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #2b1810;
            color: #fff;
            padding-bottom: 70px;
        }
        header {
            background: linear-gradient(135deg, #4a2511, #2b1810);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
        }
        header h1 {
            color: #f3c653;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .container {
            padding: 15px;
        }
        .payment-box {
            background: #3d2314;
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .payment-box h3 {
            color: #f3c653;
            margin-bottom: 10px;
            font-size: 18px;
            border-bottom: 1px solid #4a2511;
            padding-bottom: 5px;
        }
        .payment-method {
            background: #2b1810;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #d4af37;
        }
        .payment-method h4 {
            color: #e74c3c;
            margin-bottom: 5px;
        }
        .payment-method p {
            font-size: 14px;
            margin-bottom: 3px;
        }
        .number-highlight {
            color: #2ecc71;
            font-weight: bold;
            font-size: 16px;
        }
        .form-group {
            margin-top: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #f3c653;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #d4af37;
            background: #2b1810;
            color: #fff;
            font-size: 14px;
        }
        .btn {
            background: #d4af37;
            color: #2b1810;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            margin-top: 15px;
        }
        .btn:hover {
            background: #f3c653;
        }
        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1f100a;
            border-top: 1px solid #4a2511;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: #b08d57;
            text-decoration: none;
            font-size: 11px;
        }
        .nav-item.active {
            color: #f3c653;
        }
        .nav-item div {
            font-size: 16px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Motu Patlu Topup</h1>
    </header>

    <div class="container">
        <div class="payment-box">
            <h3>পেমেন্ট পদ্ধতি (Send Money)</h3>
            
            <!-- বিকাশ পেমেন্ট -->
            <div class="payment-method">
                <h4>bKash (Send Money)</h4>
                <p>আমাদের বিকাশ পার্সোনাল নাম্বারে টাকা পাঠান:</p>
                <p>নাম্বার: <span class="number-highlight">01997731007</span></p>
            </div>

            <!-- নগদ পেমেন্ট -->
            <div class="payment-method">
                <h4>Nagad (Send Money)</h4>
                <p>আমাদের নগদ পার্সোনাল নাম্বারে টাকা পাঠান:</p>
                <p>নাম্বার: <span class="number-highlight">01997731007</span></p>
            </div>

            <!-- পেমেন্ট কনফার্মেশন ফর্ম -->
            <div class="form-group">
                <label for="sender">যে নাম্বার থেকে টাকা পাঠিয়েছেন (Sender Number):</label>
                <input type="text" id="sender" placeholder="০১৯xxxxxxxx">
            </div>

            <div class="form-group">
                <label for="trxid">ট্রানজেকশন আইডি (TrxID):</label>
                <input type="text" id="trxid" placeholder="যেমন: 9L8K7... ">
            </div>

            <button class="btn">পেমেন্ট কনফার্ম করুন</button>
        </div>
    </div>

    <!-- ফুটার ন্যাভিগেশন -->
    <div class="nav-bar">
        <a href="#" class="nav-item">
            <div>🏠</div>Home
        </a>
        <a href="#" class="nav-item">
            <div>📺</div>Tutorial
        </a>
        <a href="#" class="nav-item">
            <div>🎮</div>Topup
        </a>
        <a href="#" class="nav-item active">
            <div>💳</div>Payment
        </a>
    </div>

</body>
</html>
